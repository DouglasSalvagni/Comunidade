version: '3.8'

services:
  babytune_postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - babytune_postgres_data:/var/lib/postgresql/data
    networks:
      - network_swarm_public

  babytune_redis:
    image: ${REDIS_IMAGE}
    volumes:
      - babytune_redis_data:/data
    networks:
      - network_swarm_public

  babytune_backend:
    image: ${BACKEND_IMAGE}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}
      DB_SSL: ${DB_SSL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      CDN_BASE_URL: ${CDN_BASE_URL}

      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}

      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      UPLOAD_DEST: ${UPLOAD_DEST}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      - babytune_postgres
      - babytune_redis
    volumes:
      - media_uploads:/app/uploads
    networks:
      - network_swarm_public

  babytune_worker:
    image: ${WORKER_IMAGE}
    command: ["node", "dist/src/workers/worker.js"]
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${BACKEND_PORT}

      DB_SSL: ${DB_SSL}
      DATABASE_URL: ${DATABASE_URL}

      REDIS_URL: ${REDIS_URL}
      REDIS_HOST: ${REDIS_HOST}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      CORS_ORIGIN: ${CORS_ORIGIN}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      CDN_BASE_URL: ${CDN_BASE_URL}

      THROTTLE_TTL: ${THROTTLE_TTL}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT}

      MAX_FILE_SIZE: ${MAX_FILE_SIZE}
      UPLOAD_DEST: ${UPLOAD_DEST}

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
    depends_on:
      - babytune_postgres
      - babytune_redis
    networks:
      - network_swarm_public

  babytune_frontend:
    image: ${FRONTEND_IMAGE}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    depends_on:
      - babytune_backend
    networks:
      - network_swarm_public

volumes:
  babytune_postgres_data:
  babytune_redis_data:
  media_uploads:

networks:
  network_swarm_public:
    external: true
    name: network_swarm_public
