version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: comunidade-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comunidade}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Note: Init script might need to be manually mounted or baked into a custom image if not present on host
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - comunidade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    container_name: comunidade-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - comunidade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  backend:
    # Assuming local build or image name. 
    # To build: docker compose -f docker-compose.stack.yml build backend
    image: comunidade-backend:latest
    container_name: comunidade-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/comunidade}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - comunidade-network
    deploy:
      restart_policy:
        condition: on-failure

  frontend:
    image: comunidade-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: comunidade-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      # Add other public env vars here
    networks:
      - comunidade-network
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:

networks:
  comunidade-network:
    driver: bridge
