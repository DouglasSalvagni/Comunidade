version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: babytune-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-little_tales}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Note: Init script might need to be manually mounted or baked into a custom image if not present on host
      # - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - babytune-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    container_name: babytune-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - babytune-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      restart_policy:
        condition: on-failure

  backend:
    # Assuming local build or image name. 
    # To build: docker compose -f docker-compose.stack.yml build backend
    image: babytune-backend:latest
    container_name: babytune-backend
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/little_tales}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      # AWS/S3 Configs should be added here if needed
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AWS_BUCKET_NAME: ${AWS_BUCKET_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_uploads:/app/uploads
    networks:
      - babytune-network
    deploy:
      restart_policy:
        condition: on-failure

  worker:
    image: babytune-worker:latest
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: babytune-worker
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/little_tales}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      API_BASE_URL: ${API_BASE_URL:-http://backend:3001/api/v1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - media_uploads:/app/uploads
    networks:
      - babytune-network
    deploy:
      restart_policy:
        condition: on-failure

  frontend:
    image: babytune-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: babytune-frontend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      # Add other public env vars here
    networks:
      - babytune-network
    deploy:
      restart_policy:
        condition: on-failure

volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  babytune-network:
    driver: bridge
