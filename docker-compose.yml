version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: little-tales-postgres
    environment:
      POSTGRES_DB: little_tales
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - little-tales-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: little-tales-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - little-tales-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: little-tales-backend
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/little_tales
      REDIS_URL: redis://redis:6379
      JWT_SECRET: little-tales-secret-key-change-in-production
      JWT_EXPIRATION: 7d
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - media_uploads:/app/uploads
    networks:
      - little-tales-network
    restart: unless-stopped

  # Serviço opcional para processamento de mídia
  media-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: little-tales-media-worker
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:5433/little_tales
      REDIS_URL: redis://host.docker.internal:6380
      REDIS_HOST: host.docker.internal
      REDIS_PORT: 6380
      API_BASE_URL: http://backend:3001/api/v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - media_uploads:/app/uploads
    networks:
      - little-tales-network
    restart: unless-stopped
    profiles:
      - with-worker


volumes:
  postgres_data:
  redis_data:
  media_uploads:

networks:
  little-tales-network:
    driver: bridge
