version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: comunidade-postgres
    environment:
      POSTGRES_DB: comunidade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - comunidade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comunidade-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - comunidade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # backend:
