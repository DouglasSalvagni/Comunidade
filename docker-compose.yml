version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: comunidade-postgres
    environment:
      POSTGRES_DB: comunidade
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - comunidade-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: comunidade-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - comunidade-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: comunidade-adminer
    restart: always
    ports:
      - "8084:8080"
    depends_on:
      - postgres
    networks:
      - comunidade-network

volumes:
  postgres_data:
  redis_data:

networks:
  comunidade-network:
    driver: bridge
