  #     REDIS_URL: redis://redis:6379
  #     JWT_SECRET: little-tales-secret-key-change-in-production
  #     JWT_EXPIRATION: 7d
  #     CORS_ORIGIN: http://localhost:3000
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   volumes:
  #     - ./backend:/app
  #     - /app/node_modules
  #     - media_uploads:/app/uploads
  #   networks:
  #     - comunidade-network
  #   restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: comunidade-adminer
    restart: always
    ports:
      - "8084:8080"
    depends_on:
      - postgres
    networks:
      - comunidade-network

volumes:
  postgres_data:
  redis_data:

networks:
  comunidade-network:
    driver: bridge
